name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  REGISTRY: ghcr.io

jobs:
  build-and-validate:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore FPT-EXE-201.sln

      - name: Build solution
        run: dotnet build FPT-EXE-201.sln --configuration Release --no-restore

      - name: Publish API project
        run: dotnet publish src/FPT.EXE201.Api/FPT.EXE201.Api.csproj --configuration Release --output ./artifacts/api --no-build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image name
        id: prep
        shell: bash
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image name
        id: prep
        shell: bash
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ubuntu:
    name: Deploy to Ubuntu server
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Prepare Docker image name
        id: prep
        shell: bash
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Validate deploy secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          APP_CONTAINER_NAME: ${{ secrets.APP_CONTAINER_NAME }}
          APP_HOST_PORT: ${{ secrets.APP_HOST_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -e

          for secret_name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY SERVER_APP_DIR APP_CONTAINER_NAME APP_HOST_PORT GHCR_USERNAME GHCR_PAT; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

          case "$SERVER_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*|*"BEGIN PRIVATE KEY"*) ;;
            *)
              echo "SERVER_SSH_KEY does not look like a valid private key"
              exit 1
              ;;
          esac

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            CONTAINER_NAME="${{ secrets.APP_CONTAINER_NAME }}"
            HOST_PORT="${{ secrets.APP_HOST_PORT }}"
            IMAGE="${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest"

            mkdir -p "$APP_DIR"

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Missing $APP_DIR/.env on server"
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            if docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}$"; then
              docker rm -f "$CONTAINER_NAME"
            fi

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              -p "$HOST_PORT:8080" \
              "$IMAGE"

            docker image prune -f